site_name: Embedded Systems I (LIIE1214)
site_description: Course notes for Embedded Systems I — RP2350 / Raspberry Pi Pico 2
site_author: Oliver Ochoa Garcia
repo_url: https://github.com/Gulden8ag/embedded1
repo_name: Gulden8ag/embedded1

nav:
  - Home: index.md
  - Block 0 — Introduction:
      - Syllabus: Bloque0-Introduccion/T1.md
      - Introduction: Bloque0-Introduccion/Tema_0.md
      - What is an embedded system?: Bloque0-Introduccion/Tema_A.md
      - Lab log template: Bloque0-Introduccion/T0.md
  - Block 1 — GPIO:
      - Environment and toolchain: Bloque1-GPIO/Tema_B.md
      - GPIO control: Bloque1-GPIO/Tema_C.md
      - Digital inputs: Bloque1-GPIO/Tema_D.md
      - Interrupts: Bloque1-GPIO/Tema_E.md
  - Block 2 — Timing and serial:
      - Timers: Bloque2-Temporizador/Tema_F.md
      - PWM: Bloque2-Temporizador/Tema_G.md
      - UART: Bloque2-Temporizador/Tema_H.md
  - Block 3 — Analog and buses:
      - ADC: Bloque3/Tema_I.md
      - I2C: Bloque3/Tema_J.md
  - Project:
      - Capstone Project: Proyecto/Instrucciones.md

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic:
      mode: view
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde
  - pymdownx.blocks.caption

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css